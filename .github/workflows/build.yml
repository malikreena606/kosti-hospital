name: Build Flet Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet
        run: pip install flet

      - name: Build APK
        run: flet build apk -v --yes

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: kosti-apk
          path: build/apk/*.apk
          if-no-files-found: error

      - name: Publish APK (release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kosti APK build ${{ github.run_number }}
          files: build/apk/*.apk
