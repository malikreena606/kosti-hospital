name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet[all]==0.25.0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Build APK with Flet
        run: flet build apk --yes --python-version 3.11
        env:
          FLET_CLI_SKIP_FLUTTER_DOCTOR: "true"
          FLET_BUILD_PYTHON_VERSION: "3.11"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kosti-hospital-apk
          path: build/apk/*.apk
